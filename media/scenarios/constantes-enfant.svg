<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, sans-serif">
<rect width="1600" height="900" fill="#ffffff"/><rect width="1600" height="150" fill="#1e2150"/>
<text x="80" y="95" font-size="52" font-weight="700" fill="#ffffff">Constantes à l’arrivée aux urgences</text><text x="80" y="260" font-size="40" fill="#3a3f5e">Fréquence respiratoire</text><text x="1520" y="260" text-anchor="end" font-size="48" font-weight="700" fill="#c0392b">52 /min</text><line x1="80" y1="285" x2="1520" y2="285" stroke="#d8dce8"/><text x="80" y="360" font-size="40" fill="#3a3f5e">SpO2 en air ambiant</text><text x="1520" y="360" text-anchor="end" font-size="48" font-weight="700" fill="#c0392b">86 %</text><line x1="80" y1="385" x2="1520" y2="385" stroke="#d8dce8"/><text x="80" y="460" font-size="40" fill="#3a3f5e">Fréquence cardiaque</text><text x="1520" y="460" text-anchor="end" font-size="48" font-weight="700" fill="#d35400">168 /min</text><line x1="80" y1="485" x2="1520" y2="485" stroke="#d8dce8"/><text x="80" y="560" font-size="40" fill="#3a3f5e">Température</text><text x="1520" y="560" text-anchor="end" font-size="48" font-weight="700" fill="#d35400">38,9 °C</text><line x1="80" y1="585" x2="1520" y2="585" stroke="#d8dce8"/><text x="80" y="660" font-size="40" fill="#3a3f5e">Tirage</text><text x="1520" y="660" text-anchor="end" font-size="48" font-weight="700" fill="#1a1f45">sus-sternal, intercostal</text><line x1="80" y1="685" x2="1520" y2="685" stroke="#d8dce8"/><text x="80" y="760" font-size="40" fill="#3a3f5e">Âge, poids</text><text x="1520" y="760" text-anchor="end" font-size="48" font-weight="700" fill="#1a1f45">2 ans, 12 kg</text><line x1="80" y1="785" x2="1520" y2="785" stroke="#d8dce8"/>
<text x="1520" y="870" text-anchor="end" font-size="22" fill="#888">Données fictives de simulation</text></svg>